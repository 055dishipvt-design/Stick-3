<script>
const K='studytracker.v1',BASE={Easy:10,Moderate:20,'Very Hard':35},BONUS=5;
const DUR={Easy:120,Moderate:360,'Very Hard':480};
const LV=['Pending','Not understood','Partially understood','Fully understood'],STG=['Understand','Memorize','Recall'],GLAB=['','Weak','Partial','Strong'];
const $=s=>document.querySelector(s),J=(a,f)=>a.map(f).join('');

const fd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

let S,ui={page:'dash',notes:{},sc:'D',mg:false},mem=null;

function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=mem}if(!S||!S.subj)S=def();fix()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){mem=S}}

const nses=()=>({id:uid(),no:S.ses.length+1,date:today(),closed:false});
const sObj=id=>S.subj.find(s=>s.id===id),cur=()=>S.ses[S.ses.length-1],Q=id=>S.q.find(q=>q.id===id);
function fix(){S.q=S.q||[];S.rv=S.rv||[];S.ses=S.ses||[];S.ctr=S.ctr||{};S.sel=S.sel||{};S.pb=S.pb||{};S.subj.forEach(s=>{s.ch=s.ch||[];s.ch.forEach(c=>c.topics=c.topics||[])});S.q.forEach(q=>{if(q.topic===undefined)q.topic=''});
 if(!S.ses.length||cur().closed)S.ses.push(nses());
 const c=cur();if(!live(c).length&&c.date!==today())c.date=today();
 const s=sObj(S.sel.s)||S.subj[0];S.sel.s=s?s.id:'';const h=s&&(s.ch.find(x=>x.id===S.sel.c)||s.ch[0]);S.sel.c=h?h.id:'';const tp=h&&h.topics.find(x=>x.id===S.sel.t);S.sel.t=tp?tp.id:''}
const mast=q=>{const v=q.p.flat();return v.reduce((a,b)=>a+Math.max(0,b-1)/2,0)/v.length};
function it(q,k,xp,m){const s=sObj(q.s),c=s&&s.ch.find(x=>x.id===q.c);const tp=c&&c.topics.find(x=>x.id===q.topic);return{s:q.s,c:q.c,tp:q.topic||'',tn:tp?tp.name:'',sn:s?s.name:'?',cn:c?c.name:'?',k,xp,m}}
function live(ses){const o=[];S.q.filter(q=>q.done&&q.sid===ses.id).forEach(q=>o.push(it(q,'L',q.xp,mast(q))));
 S.rv.filter(r=>r.done&&r.sid===ses.id).forEach(r=>{const q=Q(r.qid);if(q)o.push(it(q,'R',r.xp,r.st.reduce((a,b)=>a+(b-1)/2,0)/3))});return o}
function bonus(s){const p=S.ses[S.ses.indexOf(s)-1];if(!p)return 0;const n=live(s).length;return n>0&&n>(p.items||[]).length?BONUS:0}
function sst(s){const its=s.closed?s.items:live(s),b=s.closed?s.bonus||0:bonus(s),r={lc:0,lx:0,rc:0,rx:0,bonus:b};
 its.forEach(i=>{if(i.k==='L'){r.lc++;r.lx+=i.xp}else{r.rc++;r.rx+=i.xp}});r.total=r.lx+r.rx+b;return r}
const totalXP=()=>S.ses.reduce((a,s)=>a+sst(s).total,0);
const tally=(n,k)=>{let h='';for(let i=0;i<Math.floor(n/5);i++)h+='<u>||||</u> ';h+='|'.repeat(n%5);return`<span class="tl ${k}">${h||'·'}</span>`};

const TITLES=['Newcomer','Learner','Reader','Scholar','Clinician','Registrar','Consultant','Professor','Legend'];

function agg(){const A={days:{},sub:{},chp:{},top:{},lm:0,rm:0,lq:0,rq:0,ls:0,rs:0,n:0,xp:0};
 S.ses.filter(s=>s.closed).forEach(s=>{const fb=s.fb||{},its=s.items.length?s.items:[{k:'L',s:fb.s,c:fb.c,sn:fb.sn||'—',cn:fb.cn||'—',xp:0,m:null,e:1}],m=30/its.length;
  const d=A.days[s.date]||(A.days[s.date]={n:0,lm:0,rm:0,lq:0,rq:0,xp:0,t:new Set()});
  d.n++;A.n++;d.xp+=s.bonus||0;A.xp+=s.bonus||0;
  if(its.some(i=>i.k==='L'))A.ls++;if(its.some(i=>i.k==='R'))A.rs++;
  its.forEach(i=>{const L=i.k==='L';d[L?'lm':'rm']+=m;A[L?'lm':'rm']+=m;if(!i.e){d[L?'lq':'rq']++;A[L?'lq':'rq']++}d.xp+=i.xp;A.xp+=i.xp;d.t.add(i.sn+' › '+i.cn);
   const sk=i.s||i.sn,ck=i.c||i.cn,sb=A.sub[sk]||(A.sub[sk]={name:i.sn,min:0,q:0,xp:0}),cp=A.chp[ck]||(A.chp[ck]={min:0,q:0,m:[]});
   sb.min+=m;sb.xp+=i.xp;cp.min+=m;if(!i.e){sb.q++;cp.q++}if(i.m!=null)cp.m.push(i.m);if(i.tp){const top=A.top[i.tp]||(A.top[i.tp]={name:i.tn||'Topic',chapter:i.cn||'—',subject:i.sn||'—',min:0,q:0,xp:0});top.min+=m;top.xp+=i.xp;if(!i.e)top.q++}})});
 return A}

 let c=0,x=days[today()]?today():addD(today(),-1);while(days[x]){c++;x=addD(x,-1)}return{cur:c,best}}

 resetsession:async()=>{const s=cur();if(!s)return toast('No current session');const yes=await conf('Reset the current session? Completed learning and review progress from this session will be cleared. Other sessions and your question list will remain.');if(!yes)return;undoSessions([s.id]);toast('Current session reset')},
 resetone:async d=>{const s=S.ses.find(x=>x.id===d.sid);if(!s)return;const yes=await conf(`Reset session S${s.no||'—'} from ${s.date||'unknown date'}? Its completed learning/review progress will be cleared.`);if(!yes)return;undoSessions([s.id]);toast(`Session S${s.no||''} reset`)},
 mg:()=>{ui.mg=!ui.mg;rFrm()},
 theme:()=>{const root=document.documentElement;root.dataset.theme=(root.dataset.theme||'dark')==='dark'?'light':'dark';saveTheme(root.dataset.theme)},
 as:async()=>{const n=await ask('New subject');if(n){const s={id:uid(),name:n,ch:[]};S.subj.push(s);S.sel.s=s.id;fix();save();rAll()}},
 rs:async d=>{const s=sObj(d.s),n=await ask('Rename subject',s.name);if(n){s.name=n;save();rAll()}},
 ds:async d=>{if(await conf('Delete this subject, its chapters and their questions?')){const s=sObj(d.s);s.ch.forEach(c=>delete S.ctr[c.id]);const ids=S.q.filter(q=>q.s===d.s).map(q=>q.id);S.q=S.q.filter(q=>q.s!==d.s);S.rv=S.rv.filter(r=>!ids.includes(r.qid));S.subj=S.subj.filter(x=>x.id!==d.s);fix();save();rAll()}},
 ac:async d=>{const n=await ask('New chapter');if(n){const h={id:uid(),name:n,topics:[]};sObj(d.s).ch.push(h);S.sel.s=d.s;S.sel.c=h.id;S.sel.t='';fix();save();rAll()}},
 at:async d=>{const n=await ask('New topic');if(n){const c=sObj(d.s).ch.find(x=>x.id===d.c);c.topics=c.topics||[];const t={id:uid(),name:n};c.topics.push(t);S.sel.s=d.s;S.sel.c=d.c;S.sel.t=t.id;fix();save();rAll()}},
 rt:async d=>{const c=sObj(d.s).ch.find(x=>x.id===d.c),t=c.topics.find(x=>x.id===d.t),n=await ask('Rename topic',t.name);if(n){t.name=n;save();rAll()}},
 dt:async d=>{if(await conf('Delete this topic? Questions assigned to it will become unassigned.')){const c=sObj(d.s).ch.find(x=>x.id===d.c);c.topics=c.topics.filter(x=>x.id!==d.t);S.q.forEach(q=>{if(q.topic===d.t)q.topic=''});if(S.sel.t===d.t)S.sel.t='';save();rAll()}},
 rc:async d=>{const h=sObj(d.s).ch.find(x=>x.id===d.c),n=await ask('Rename chapter',h.name);if(n){h.name=n;save();rAll()}},
 dc:async d=>{if(await conf('Delete this chapter and its questions?')){const s=sObj(d.s);s.ch=s.ch.filter(x=>x.id!==d.c);const ids=S.q.filter(q=>q.c===d.c).map(q=>q.id);S.q=S.q.filter(q=>q.c!==d.c);S.rv=S.rv.filter(r=>!ids.includes(r.qid));delete S.ctr[d.c];fix();save();rAll()}},
 iq:()=>{modal(`<b>Import questions (CSV)</b><small>Columns: subject, chapter, topic, number, title, difficulty, parts. "question" also works as the title column and "priority" as difficulty. Missing subjects, chapters and topics are created. Existing question numbers and identical titles are skipped, and your progress is untouched.</small><button class="btn sg" id="cpp">Copy AI prompt (paste it with your JSON into any chat AI)</button><input id="jf" type="file" accept=".csv,.txt,text/csv"><textarea id="jt" rows="6" placeholder="…or paste CSV here"></textarea><div class="row"><button class="btn" id="cx">Cancel</button><button class="btn pk" id="go">Import</button></div>`);
  $('#cx').onclick=closeM;$('#jf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('#jt').value=t)};
  $('#cpp').onclick=async()=>{try{await navigator.clipboard.writeText(AIP)}catch(e){$('#jt').value=AIP;$('#jt').select();document.execCommand('copy')}toast('Prompt copied')};
  $('#go').onclick=()=>{try{const r=importCSV($('#jt').value);closeM();show();toast(r.add+' added'+(r.skip?', '+r.skip+' skipped':''))}catch(e){toast('Check the CSV header row')}}},
 ex:()=>{const j=JSON.stringify(S,null,1);modal(`<b>Backup (JSON)</b><textarea id="jt" readonly rows="8">${esc(j)}</textarea><div class="row"><button class="btn pk" id="cp">Copy</button><a class="btn" id="dl" download="study-tracker-backup.json">Download</a><button class="btn" id="cx">Close</button></div>`);
  $('#dl').href=URL.createObjectURL(new Blob([j],{type:'application/json'}));$('#cx').onclick=closeM;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(j)}catch(e){$('#jt').select();document.execCommand('copy')}toast('Copied')}},
 im:()=>{modal(`<b>Import backup</b><input id="jf" type="file" accept=".json,application/json"><textarea id="jt" rows="6" placeholder="…or paste JSON here"></textarea><small>This replaces all current data.</small><div class="row"><button class="btn" id="cx">Cancel</button><button class="btn pk" id="go">Import</button></div>`);
  $('#cx').onclick=closeM;$('#jf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('#jt').value=t)};
  $('#go').onclick=()=>{try{const o=JSON.parse($('#jt').value);if(!Array.isArray(o.subj)||!Array.isArray(o.ses))throw 0;S=o;fix();save();closeM();show();toast('Imported')}catch(e){toast('Invalid backup file')}}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset)});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;
 if(c==='ssel'){S.sel.s=t.value;S.sel.c='';fix();save();rAll()}else if(c==='csel'){S.sel.c=t.value;S.sel.t='';fix();save();rAll()}else if(c==='tsel'){S.sel.t=t.value;save();rAll()}
 else if(c==='diff'){const q=Q(t.dataset.q);if(q&&!q.done){q.d=t.value;sv()}}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.i==='note'){const q=Q(t.dataset.q);if(q){q.note=t.value;save()}}});
document.addEventListener('keydown',e=>{if(e.target.id==='qt'&&e.key==='Enter')act.addq()});
loadTheme();load();save();show();
</script></body></html>
